spring.application.name=social-platform
spring.datasource.url=jdbc:h2:mem:platform
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Exp 6 - Ehcache through JCache
spring.cache.type=jcache
spring.cache.jcache.config=classpath:ehcache.xml

# Exp 5 - correlation id in every log line
logging.pattern.level=%5p [%X{correlationId:-}]

# Exp 7 - secrets (override with environment variables in real deployments)
app.jwt.secret=${JWT_SECRET:VGhpc0lzQTMyQnl0ZVNlY3JldEtleUZvckp3dDEyMzQ=}
app.jwt.access-expiry-ms=900000
app.jwt.refresh-expiry-days=7
app.security.aes-key=${AES_KEY:QWVzS2V5MzJCeXRlc0xvbmdGb3JUaGVEZW1vT25seSE=}
